[package]
name = "filesearch"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "global-shortcut", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rayon = "1.7"
walkdir = "2"
regex = "1"
chrono = "0.4"
crossbeam = "0.8"
parking_lot = "0.12"
indexmap = "2"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
rustc-hash = "1.1"
bincode = "1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security"
] }

[lib]
crate-type = ["cdylib"]

[build-dependencies]
tauri-build = "1.5"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = false