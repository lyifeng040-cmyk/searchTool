[package]
name = "filesearch"
version = "2.0.0"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = [
  "shell-open",
  "global-shortcut",
  "window-all",
  "dialog-all",
  "fs-all",
  "app-all",
  "system-tray",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rayon = "1.7"
walkdir = "2"
regex = "1"
chrono = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
rustc-hash = "1.1"
bincode = "1.3"
dirs = "5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
indexmap = "2"
notify = "6"
rmp-serde = "1"
thiserror = "1"
rusqlite = { version = "0.30", features = ["bundled"] }
trash = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
] }
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Security",
] }

[lib]
name = "filesearch_lib"
crate-type = ["cdylib", "rlib"]

[features]
# 右键“删除”默认进回收站（Windows: Recycle Bin）。不开启则会退化为永久删除（仅用于极端环境）。
trash = ["dep:trash"]

[build-dependencies]
tauri-build = "1.5"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = false
